<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>교사 페이지 · 식물과 에너지 정원</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&family=Share+Tech+Mono&display=swap">
<link rel="stylesheet" href="css/style.css">
<style>
#app{min-height:100vh}
#app>.login-card{margin:60px auto}
.tpane{display:grid;gap:14px;max-width:1400px}
.scroll{overflow-x:auto;border:2px solid var(--ink);border-radius:12px;background:#fff}
.ttable{font-size:14px;min-width:760px}.ttable th,.ttable td{border-width:1px;padding:6px 8px}
.pc{display:grid;gap:4px;justify-items:center}td.pc{display:table-cell}td.pc>*{display:block;margin:2px auto}
.st-locked{background:#f1f1f1;color:#777}.st-open{background:#fff6cc}.st-done{background:#d9f3dd}
.tsel,.tinput{border:2px solid var(--ink);border-radius:10px;padding:8px 10px;font-size:16px;background:#fff}.tinput{flex:1;min-width:220px}
.tcb{width:24px;height:24px}
.givebtn{font-size:17px}.givebtn.good{background:#d9f3dd}.givebtn.bad{background:#fde4e0}
.okc{background:#d9f3dd;font-weight:900;color:var(--good)}
.anscell{text-align:start!important}.anscell p{margin:2px 0}
td.mini svg,td.mini img{height:38px;width:auto}
.tabs button{font-size:15px;padding:6px 14px}
</style>
</head>
<body>
<main id="app"></main>
<script src="js/config.js"></script>
<script>window.LANG = { ko: {} };</script>
<script src="js/core.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/plants.js"></script>
<script src="js/teacher.js"></script>
</body>
</html>
